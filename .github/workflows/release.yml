name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
          - arch: arm64
            platform: ARM64
    steps:
      - uses: actions/checkout@v4

      - name: Restore Windows App SDK packages
        shell: pwsh
        run: ./desktop/tools/restore-packages.ps1

      - name: Show environment
        shell: pwsh
        run: |
          cmake --version
          Write-Host "--- packages ---"
          Get-ChildItem desktop/packages -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          Write-Host "--- windows kits ---"
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          Write-Host "--- cppwinrt ---"
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\cppwinrt.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

      - name: Configure
        shell: pwsh
        working-directory: desktop
        run: cmake -S . -B build-${{ matrix.arch }} -G "Visual Studio 17 2022" -A ${{ matrix.platform }}

      - name: Build
        shell: pwsh
        working-directory: desktop
        run: cmake --build build-${{ matrix.arch }} --config Release

      - name: Download Windows App Runtime
        continue-on-error: true
        shell: pwsh
        working-directory: desktop
        run: |
          $url = "https://aka.ms/windowsappsdk/1.8/latest/windowsappruntimeinstall-${{ matrix.arch }}.exe"
          $out = "build-${{ matrix.arch }}\Release\WindowsAppRuntimeInstall.exe"
          try {
            Invoke-WebRequest -Uri $url -OutFile $out
            Write-Host "Downloaded Windows App Runtime installer"
          } catch {
            Write-Host "Could not download the Windows App Runtime installer: $_"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        working-directory: desktop
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer.iss `
            /DArch=${{ matrix.arch }} `
            /DSourceDir="build-${{ matrix.arch }}\Release" `
            /DOutputDir="installer-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.arch }}
          path: desktop/installer-${{ matrix.arch }}/*.exe
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: "1.0"
          body_path: CHANGELOG.md
          files: artifacts/*.exe
